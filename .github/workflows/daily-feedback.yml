name: Daily Tour Feedback Emails

on:
  schedule:
    # Target: ~8:00 AM Eastern, 1 hour after reminders to give tours time to
    # complete. GitHub cron is UTC-only with no DST awareness, so we register
    # two schedules — one for EDT, one for EST — and the job runs only the one
    # matching the currently active Eastern offset (see the DST guard in the
    # send step). Both are set ~1h early and off the top-of-hour to bias the
    # send toward 8 AM.
    - cron: '50 10 * * *'  # EDT: 10:50 UTC, lands ~8 AM after typical lag
    - cron: '50 11 * * *'  # EST: 11:50 UTC, lands ~8 AM after typical lag
  # Allow manual triggering for testing
  workflow_dispatch:

jobs:
  send-feedback:
    runs-on: ubuntu-latest
    
    steps:
    - name: Send feedback emails
      run: |
        # --- DST guard: run only the cron matching the active Eastern offset ---
        # GitHub cron is UTC-only, so both EDT and EST schedules fire year-round.
        # github.event.schedule is the cron string that triggered this run; we
        # compare it against the current America/New_York offset and skip the
        # mismatched one. Manual (workflow_dispatch) runs have an empty schedule
        # and always proceed.
        offset=$(TZ="America/New_York" date +%z)
        schedule="${{ github.event.schedule }}"
        if [ -n "$schedule" ]; then
          if { [ "$offset" = "-0400" ] && [ "$schedule" != "50 10 * * *" ]; } || \
             { [ "$offset" = "-0500" ] && [ "$schedule" != "50 11 * * *" ]; }; then
            echo "Skipping: schedule '$schedule' does not match active Eastern offset $offset."
            exit 0
          fi
        fi

        echo "Triggering daily feedback emails..."
        
        # Call the Netlify function endpoint
        response=$(curl -s -w "%{http_code}" \
          -X GET \
          -H "User-Agent: GitHub-Actions-Cron" \
          -H "X-GitHub-Workflow: daily-feedback" \
          -H "X-API-Key: ${{ secrets.CRON_API_KEY }}" \
          https://tours.robotics.umich.edu/api/send-feedback-emails)
        
        http_code="${response: -3}"
        response_body="${response%???}"
        
        echo "HTTP Status: $http_code"
        echo "Response: $response_body"
        
        # Check if the request was successful
        if [ "$http_code" -eq 200 ]; then
          echo "✅ Feedback emails sent successfully!"
        else
          echo "❌ Failed to send feedback emails (HTTP $http_code)"
          echo "Response body: $response_body"
          exit 1
        fi
        
    - name: Log completion
      run: |
        echo "Daily feedback job completed at $(date -u)"
        echo "Next run: Tomorrow ~8:00 AM Eastern"